name: WordPress tests and reproducible package

on:
  pull_request:
  push:
    branches:
      - main
      - 'codex/**'
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php_tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        php: ['8.1', '8.3', '8.5']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, openssl
      - name: Run all declared PHP fixture suites
        run: |
          php tests/run.php
          php tests/integration.php
          php tests/source-url-proof.php
      - name: Validate PHP syntax
        run: find . -path ./.git -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l

  browser_assets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install locked browser dependencies
        run: npm ci
      - name: Check and test browser source
        run: |
          npm run check
          npm run test:browser
      - name: Verify bundled asset freshness
        run: |
          npm run build
          git diff --exit-code -- assets

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [php_tests, browser_assets]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: "8.3"
      - name: Run adapter tests
        run: php tests/run.php
      - name: Validate PHP syntax
        run: find . -path ./.git -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Prove cross-checkout V4 package reproducibility
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $comparisonRoot = Join-Path $env:RUNNER_TEMP 'discussionbridge-v4-package-comparison'
          git worktree add --detach $comparisonRoot $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Could not create the comparison checkout' }
          $first = & ./scripts/build-release.ps1 -OutputName 'ci-a.zip' | ConvertFrom-Json
          $second = & (Join-Path $comparisonRoot 'scripts/build-release.ps1') -OutputName 'ci-b.zip' | ConvertFrom-Json
          if ($first.sha256 -cne $second.sha256) { throw 'V4 package bytes differ between checkouts' }
          & ./scripts/verify-release.ps1 -Path $first.path
          & ./scripts/verify-release.ps1 -Path $second.path
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: wordpress-discussion-bridge-${{ github.sha }}
          path: .artifacts/ci-a.zip
          include-hidden-files: true
          if-no-files-found: error
